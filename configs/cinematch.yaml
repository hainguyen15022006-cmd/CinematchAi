project:
  name: cinematch
  random_seed: 42

data:
  dataset_name: movielens-100k
  version: ml100k-temporal-v1

  feature_contract:
    version: hybrid-v1-167
    total_dimensions: 167

  expected:
    ratings: 100000
    users: 943
    movies: 1682

  raw:
    ratings_path: data/raw/ml-100k/u.data
    movies_path: data/raw/ml-100k/u.item

  processed:
    train_path: data/processed/train.csv
    validation_path: data/processed/validation.csv
    test_path: data/processed/test.csv
    movies_path: data/processed/movies.csv
    mappings_path: data/processed/id_mappings.json

  reports:
    split_audit_path: outputs/eda/split_audit.json
    data_manifest_path: outputs/data_manifest.json
    evaluation_handoff_dir: outputs/evaluation

  features:
    movie_numeric_path: outputs/features/movie_numeric_features.csv
    user_genre_profiles_path: outputs/features/user_genre_profiles.csv
    numeric_preprocessor_path: outputs/features/numeric_feature_preprocessor.json

  temporal_split:
    strategy: per_user
    order_column: timestamp
    tie_breaker_column: movie_id
    train_ratio: 0.8
    validation_ratio: 0.1
    test_ratio: 0.1
    minimum_interactions_per_user: 10
    allocation_method: largest_remainder

evaluation:
  positive_rating_threshold: 4.0
  top_k: 10
  negative_sample_size: 100

  cold_start:
    keep_original_rows: true
    report_full_metrics: true
    report_warm_start_metrics: true

baselines:
  output_dir: outputs/baselines
  embedding_dim: 32
  batch_size: 1024
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.00001
  patience: 3
  popularity_prior_count: 20.0
