[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinematch"
version = "0.1.0"
description = "Group movie recommendation system"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2,<3",
    "fastapi>=0.115,<1",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pwdlib[argon2]>=0.2,<1",
    "pydantic-settings>=2,<3",
    "python-jose[cryptography]>=3.3,<4",
    "PyYAML>=6,<7",
    "sqlalchemy>=2,<3",
    "torch>=2.2,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["cinematch*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
